  short_description: "短期値幅狙いの日本株順張り候補を抽出"
  default_prompt: "Use $japan-high-beta-breakout-screening to screen Japanese stocks for high-beta breakout candidates over the next 1-2 weeks. Keep breakout-focused selection and existing watch/reserve gates unchanged, but expand the review universe each run by checking previous watch/reserve first, then active themes, exploratory themes, and a small number of outside-theme assists. Keep context-mode first, compact output by default, and stop if the referenced state file is stale or malformed."
